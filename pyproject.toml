[project]
name = "black-mirror"
version = "1.2.0"
description = "A research prototype for mediated agent actions, Linux process containment, and auditable security invariants."
requires-python = ">=3.10"
dependencies = ["pyseccomp", "cryptography>=42"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mirror_world*"]
